<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paid</title>
<style>
  :root{--bg:#0e0f12;--card:#17191e;--text:#f2f3f5;--mute:#8b909c;--red:#ff5a5f;--green:#5fd3a5;--gold:#f2c76b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    display:grid;place-items:center;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);overflow:hidden;
    -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
  .card{width:100%;max-width:360px;background:var(--card);border-radius:24px;padding:28px 24px 26px;text-align:center;
    position:relative;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .who{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{display:inline-block;margin-top:6px;font-size:12px;color:var(--mute);border:1px solid #2a2d35;border-radius:999px;padding:3px 10px}
  .lbl{color:var(--mute);font-size:13px;margin-top:22px}
  .bal{font-size:46px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;transition:color .3s}
  .bal.done{color:var(--green);animation:thump .5s ease}
  .bal.neg{color:var(--red)}
  @keyframes thump{40%{transform:scale(1.08)}}
  .minus{color:var(--red);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;height:34px;margin-top:4px;
    opacity:0;transform:translateY(-14px)}
  .minus.in{animation:drop .5s cubic-bezier(.2,1.3,.4,1) forwards}
  .minus.out{animation:sink .6s ease-in forwards}
  @keyframes drop{to{opacity:1;transform:none}}
  @keyframes sink{from{opacity:1;transform:none}to{opacity:0;transform:translateY(26px) scale(.8)}}
  .was{color:var(--mute);font-size:13px;margin-top:14px;opacity:0;transition:opacity .4s}
  .was.show{opacity:1}
  .was s{text-decoration-color:var(--red)}
  .coin{position:absolute;top:46%;left:50%;font-size:22px;pointer-events:none;animation:fly .9s cubic-bezier(.2,.7,.4,1) forwards}
  @keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
  .hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;text-align:center;color:var(--mute);font-size:12px;opacity:0;transition:opacity .4s}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="who" id="who"></div>
  <div class="chip" id="cat"></div>
  <div class="lbl">Balance</div>
  <div class="bal" id="bal"></div>
  <div class="minus" id="minus"></div>
  <div class="was" id="was"></div>
</div>

<script>
const CUR="HK$";
const num=s=>{const n=parseFloat(String(s||"").replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n};
const money=n=>(n<0?"−":"")+CUR+Math.abs(n).toLocaleString("en-HK",{minimumFractionDigits:2,maximumFractionDigits:2});
function fromHash(){
  let h=(location.hash||"").slice(1); if(!h) return null;
  try{ h=decodeURIComponent(h); }catch(e){}
  h=h.replace(/\s/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(h.length%4) h+="=";
  try{ const b=atob(h); return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))); }catch(e){ return null; }
}
let raw=(fromHash()||"").trim();
if(!raw) raw="1245.80|HK$48.00|1197.80|Food|Café de Coral";   // demo
const p=raw.split("|");
const oldB=num(p[0]), amt=Math.abs(num(p[1])), newB=p[2]!==undefined&&p[2].trim()!==""?num(p[2]):oldB-amt;
const cat=(p[3]||"").trim(), who=(p[4]||"Purchase").trim();
const icons={Food:"🍜",Transport:"🚇",Shopping:"🛍️",Other:"•"};
document.getElementById("who").textContent=who;
document.getElementById("cat").textContent=(icons[cat]?icons[cat]+" ":"")+(cat||"Other");
const balEl=document.getElementById("bal"), minus=document.getElementById("minus"), was=document.getElementById("was");
balEl.textContent=money(oldB);
minus.textContent="−"+money(amt);

const snd=document.getElementById("snd");
function ching(){ try{snd.currentTime=0;const pr=snd.play(); if(pr&&pr.catch) pr.catch(()=>{document.getElementById("hint").style.opacity=1});}catch(e){} }
document.addEventListener("click",()=>{document.getElementById("hint").style.opacity=0;ching();});

function coins(){
  const card=document.getElementById("card");
  for(let i=0;i<10;i++){
    const c=document.createElement("div"); c.className="coin"; c.textContent=i%3?"🪙":"✨";
    const a=Math.random()*Math.PI*2, d=90+Math.random()*80;
    c.style.setProperty("--x",Math.cos(a)*d+"px"); c.style.setProperty("--y",Math.sin(a)*d-40+"px");
    c.style.setProperty("--r",(Math.random()*720-360)+"deg"); card.appendChild(c); setTimeout(()=>c.remove(),1000);
  }
}
setTimeout(()=>minus.classList.add("in"),450);
setTimeout(()=>{
  minus.classList.remove("in"); minus.classList.add("out");
  const t0=performance.now(), D=900;
  (function step(t){
    const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,3);
    balEl.textContent=money(oldB+(newB-oldB)*e);
    if(k<1) requestAnimationFrame(step);
    else{
      balEl.classList.add(newB<0?"neg":"done"); ching(); coins();
      was.innerHTML="was <s>"+money(oldB)+"</s>"; was.classList.add("show");
    }
  })(t0);
},1300);
</script>
</body>
</html>
